<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Force Rating Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column. Header + gate strip on top, role-aware tabs below; dense ledger tables, quota meters beside the rating list. */
:root{
  --bg:#F1F4F4; --surface:#FFFFFF; --ink:#15232A; --muted:#5A6A72; --line:#D3DBDE;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#DCEDED;
  --ok:#1B6E3F; --ok-soft:#DDF0E4; --warn:#8F5200; --warn-soft:#FBEBCB; --bad:#A8231B; --bad-soft:#F8DEDB;
  --lock:#7A878D; --lock-soft:#E7ECEE;
  --body:'IBM Plex Sans','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181D; --surface:#16242A; --ink:#E3ECEE; --muted:#9BABB2; --line:#2A3A41;
  --accent:#4FC4C0; --accent-ink:#062120; --accent-soft:#17383A;
  --ok:#74D19B; --ok-soft:#173523; --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#FF9C93; --bad-soft:#40201D;
  --lock:#8FA0A7; --lock-soft:#20323A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#16242A; --ink:#E3ECEE; --muted:#9BABB2; --line:#2A3A41;
  --accent:#4FC4C0; --accent-ink:#062120; --accent-soft:#17383A;
  --ok:#74D19B; --ok-soft:#173523; --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#FF9C93; --bad-soft:#40201D;
  --lock:#8FA0A7; --lock-soft:#20323A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.zh{opacity:.82}
.mut{color:var(--muted)} .mono{font-family:var(--mono)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-family:var(--mono);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
label.v{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.gate .gl{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.gate .gl b{font-family:var(--mono);color:var(--accent)}
.gate .gv{font-family:var(--mono);font-size:18px;margin:4px 0 6px}
.bar{height:4px;background:var(--lock-soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.pad{padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.tchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tchip small{color:var(--muted);font-size:12px}

.chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;line-height:1.6;background:var(--lock-soft);color:var(--lock);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}

.banner{border-radius:6px;padding:10px 14px;border:1px solid var(--line);background:var(--lock-soft)}
.banner.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner ul{margin:6px 0 0;padding-left:18px}

.fdrow{padding:10px 14px;border-top:1px solid var(--line)}
.fdrow:first-child{border-top:0}
.fdhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:8px}
.fd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fc{border:1px solid var(--line);border-radius:5px;padding:6px 4px;text-align:center;background:var(--surface);min-width:0}
.fc .fg{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--muted)}
.fc .fn{font-family:var(--mono);font-size:18px;line-height:1.2}
.fc .fp{font-family:var(--mono);font-size:12px}
.fc .fr{font-family:var(--mono);font-size:10px;color:var(--muted)}
.fc .fs{font-size:10px;min-height:14px;margin-top:2px;overflow-wrap:anywhere}
.fc.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.fc.over{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.fc.under{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.fc.ok .fg,.fc.ok .fr,.fc.over .fg,.fc.over .fr,.fc.under .fg,.fc.under .fr{color:inherit;opacity:.85}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.grp td{background:var(--bg);font-weight:600;font-size:12px;padding:6px 10px}
tr.locked td{background:var(--lock-soft)}
tr.tot td{font-weight:600;background:var(--bg)}
.emp b{font-weight:500} .emp span{display:block;color:var(--muted);font-size:12px;font-family:var(--mono)}
.gb{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-family:var(--mono);font-weight:500}
.gb+.gb{margin-left:4px}
.gb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gb:disabled{opacity:.45;cursor:not-allowed}
.prev{display:inline-block;min-width:26px;text-align:center;border:1px dashed var(--line);border-radius:4px;font-family:var(--mono);padding:2px 6px}
input.rm,input.rs{width:100%;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
input.rm.req,input.rs.req{border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.rec td.g{text-align:right;font-family:var(--mono);white-space:nowrap}
.rec td.g small{display:block;font-size:11px;opacity:.8}
.rec td.ok{background:var(--ok-soft);color:var(--ok)} .rec td.over{background:var(--bad-soft);color:var(--bad)} .rec td.under{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12px;color:var(--muted)}
ul.org{list-style:none;margin:8px 0 0 6px;padding:0 0 0 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
ul.org ul.org{margin-top:6px}
.hd{margin:0;padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
textarea.tsv{width:100%;min-height:110px;font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:560px){.fc .fs{display:none}.fc .fn{font-size:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>

<script>
(function(){
var GROUPS=[{id:'SS',en:'Staff & Supervisor',zh:'专员及主管'},{id:'MA',en:'Manager & Asst. Mgr',zh:'经理及副经理'},{id:'SD',en:'Sr. Mgr & DGM',zh:'总监及副总经理'},{id:'GM',en:'GM',zh:'总经理'}];
var GRADES=['S','A','B','C','D'];
var QUOTA={S:[0,5],A:[15,20],B:[60,70],C:[5,10],D:[0,5]};
var DEPTS=[{id:'SAL',en:'Sales',zh:'销售部'},{id:'OPS',en:'Operations',zh:'运营部'}];
var STAGES={1:{en:'Preliminary 1 · Direct Manager',zh:'初评 · 直属经理',se:'Prelim 1',sz:'初评'},
            2:{en:'Preliminary 2 · Dept Head',zh:'复评 · 部门负责人',se:'Prelim 2',sz:'复评'},
            3:{en:'Final · Division Head',zh:'终评 · 事业部负责人',se:'Final',sz:'终评'}};
var ROLES={hr:['HR','人力资源'],center:['Division Head','事业部负责人'],dh:['Dept Head','部门负责人'],mgr:['Direct Manager','直属经理']};
var KEY='force-rating-desk-v2';

var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var ui={lang:'both',viewer:'E1011',tab:'rating',task:null,recapStage:3,recapGroup:'ALL',drafts:true,confirm:null,reopen:null,reopenReason:'',tsv:null,resetAsk:false};
var S,T={};
var $app=document.getElementById('app');

function b(en,zh){return ui.lang==='en'?esc(en):ui.lang==='zh'?esc(zh):esc(en)+' <span class="zh">'+esc(zh)+'</span>';}
function p(en,zh){return ui.lang==='en'?en:ui.lang==='zh'?zh:en+' / '+zh;}
function fmt(x){return String(+x.toFixed(1));}
function gname(id){var g=GROUPS.filter(function(x){return x.id===id;})[0];return g;}
function dname(id){var d=DEPTS.filter(function(x){return x.id===id;})[0];return d;}
function dp(id){var d=dname(id);return p(d.en,d.zh);}

/* ---------- data ---------- */
function seed(){
  var s=20261024;function rnd(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;}
  var F=['Adi','Bella','Chen','Dewi','Eko','Fang','Gita','Hendra','Irene','Joko','Kevin','Lina','Maya'];
  var L=['Pratama','Wijaya','Santoso','Lim','Tan','Kusuma','Hartono','Susanto'];
  var n=0;function nm(){var i=n++,a=i%13,k=Math.floor(i/13);return F[a]+' '+L[(a*2+k*3)%8];}
  var POS={SAL:['Sales Executive','Account Supervisor','Key Account Executive','Sales Admin'],
    OPS:['Production Planner','Logistics Supervisor','Operations Executive','QA Inspector'],
    FIN:['Accountant','Finance Supervisor','AP Executive','Cost Analyst'],
    HRA:['HR Executive','Recruitment Supervisor','Admin Officer','Payroll Executive']};
  function kpi(){return Math.min(99.5,Math.round((68+rnd()*26+rnd()*6)*10)/10);}
  var emps=[];
  DEPTS.forEach(function(d,di){emps.push({id:'E'+(1001+di),name:nm(),pos:di%2?'DGM':'Sr. Manager',level:'SD',dept:d.id,kpi:kpi(),mgr:'CH01',dh:'CH01',ch:'CH01',rt:{},rm:{}});});
  var mi=0;
  DEPTS.forEach(function(d,di){for(var k=0;k<3;k++){emps.push({id:'E'+(1011+mi),name:nm(),pos:k===2?'Asst. Manager':'Manager',level:'MA',dept:d.id,kpi:kpi(),mgr:'E'+(1001+di),dh:'E'+(1001+di),ch:'CH01',rt:{},rm:{}});mi++;}});
  var j=0;
  DEPTS.forEach(function(d,di){for(var k=0;k<3;k++){var mid='E'+(1011+di*3+k);for(var q=0;q<5;q++){
    var pend=[8,17].indexOf(j)>=0;
    emps.push({id:'E'+(1101+j),name:nm(),pos:POS[d.id][(q+k)%4],level:'SS',dept:d.id,kpi:pend?null:kpi(),mgr:mid,dh:'E'+(1001+di),ch:'CH01',rt:{},rm:{}});j++;}}});
  return {emps:emps,sub:{},log:[]};
}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&j.emps&&j.sub&&j.log)return j;}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function log(act,detail){S.log.unshift({t:Date.now(),who:V().name,act:act,detail:detail});if(S.log.length>400)S.log.length=400;}

function person(id){
  if(id==='HR')return {id:id,name:'HRBP · Performance CoE',role:'hr',dept:'ALL'};
  if(id==='CH01')return {id:id,name:'Michael Tan',role:'center',dept:'ALL'};
  var e=S.emps.filter(function(x){return x.id===id;})[0];
  return e?{id:id,name:e.name,role:e.level==='SD'?'dh':'mgr',dept:e.dept}:null;
}
function V(){return person(ui.viewer)||person('HR');}

/* ---------- flow logic ---------- */
function chain(e){
  var c=[{s:1,r:e.mgr}],last=e.mgr;
  if(e.dh!==last){c.push({s:2,r:e.dh});last=e.dh;}
  if(e.ch!==last){c.push({s:3,r:e.ch});}
  return c;
}
function buildTasks(){
  var m={};
  S.emps.forEach(function(e){chain(e).forEach(function(c,i){
    var k=c.s+':'+c.r;if(!m[k])m[k]={key:k,s:c.s,r:c.r,items:[]};m[k].items.push({e:e,i:i});});});
  return m;
}
function info(t){
  var sub=!!S.sub[t.key];
  var pk={};t.items.forEach(function(x){if(x.i>0){var c=chain(x.e)[x.i-1];pk[c.s+':'+c.r]=1;}});
  var prevKeys=Object.keys(pk),prevPend=prevKeys.filter(function(k){return !S.sub[k];});
  var kpiPend=t.items.filter(function(x){return x.e.kpi==null;}).length;
  var rated=t.items.filter(function(x){return x.e.rt[t.s];}).length;
  var st=sub?'submitted':prevPend.length?'locked':(t.s===1&&rated)?'progress':'open';
  return {sub:sub,prevKeys:prevKeys,prevPend:prevPend,kpiPend:kpiPend,rated:rated,total:t.items.length,st:st};
}
function prevRating(e,s){var c=chain(e),idx=-1;c.forEach(function(x,i){if(x.s===s)idx=i;});return idx>0?e.rt[c[idx-1].s]:null;}
function changed(e,s){var pr=prevRating(e,s);return !!(pr&&e.rt[s]&&e.rt[s]!==pr);}
function needRemark(e,s){return changed(e,s)&&!String(e.rm[s]||'').trim();}
function blockers(t,inf){
  var r={kpi:inf.kpiPend,unrated:0,remark:0};
  t.items.forEach(function(x){var e=x.e;if(e.kpi==null)return;if(!e.rt[t.s])r.unrated++;else if(needRemark(e,t.s))r.remark++;});
  return r;
}
function ratingAt(e,s){
  var c=chain(e).filter(function(x){return x.s<=s;});
  for(var i=c.length-1;i>=0;i--){var r=e.rt[c[i].s];if(r&&(ui.drafts||S.sub[c[i].s+':'+c[i].r]))return r;}
  return null;
}
function dist(list){var c={S:0,A:0,B:0,C:0,D:0},n=0;list.forEach(function(g){if(g){c[g]++;n++;}});return {c:c,n:n};}
function state(g,c,n){if(!n)return 'na';var pc=c[g]/n*100,q=QUOTA[g];if(pc<q[0]-1e-9)return 'under';if(pc>q[1]+1e-9)return 'over';return 'ok';}
function stLabel(s){return s==='ok'?b('In range','范围内'):s==='over'?b('Over','超出'):s==='under'?b('Under','不足'):'';}
function cells(c,n){
  return GRADES.map(function(g){var st=state(g,c,n),pc=n?c[g]/n*100:0;
    return '<div class="fc '+st+'"><div class="fg">'+g+'</div><div class="fn">'+c[g]+'</div><div class="fp">'+(n?fmt(pc)+'%':'–')+'</div><div class="fr">'+QUOTA[g][0]+'–'+QUOTA[g][1]+'%</div><div class="fs">'+stLabel(st)+'</div></div>';}).join('');
}
function pname(id){var q=person(id);return q?q.name:id;}

/* ---------- rendering ---------- */
function render(){
  T=buildTasks();
  var v=V();
  var tabsFor=v.role==='hr'?['progress','recap','audit']:['rating','recap'];
  if(tabsFor.indexOf(ui.tab)<0)ui.tab=tabsFor[0];
  var body=ui.tab==='rating'?ratingView():ui.tab==='recap'?recapView():ui.tab==='progress'?progressView():auditView();
  $app.innerHTML=header()+strip()+tabs(tabsFor)+body+footer();
}
function header(){
  var opts='<option value="HR"'+(ui.viewer==='HR'?' selected':'')+'>HR · '+esc(p('Overview','总览'))+'</option>'+
    '<option value="CH01"'+(ui.viewer==='CH01'?' selected':'')+'>'+esc(p('Division Head','事业部负责人'))+' · Michael Tan</option>';
  function grp(label,filter){
    var o=S.emps.filter(filter).map(function(e){return '<option value="'+e.id+'"'+(ui.viewer===e.id?' selected':'')+'>'+esc(e.name)+' · '+esc(dp(e.dept))+'</option>';}).join('');
    return '<optgroup label="'+esc(label)+'">'+o+'</optgroup>';}
  opts+=grp(p('Dept Head','部门负责人'),function(e){return e.level==='SD';})+grp(p('Direct Manager','直属经理'),function(e){return e.level==='MA';});
  var lg=[['en','EN'],['zh','中文'],['both','EN + 中文']].map(function(x){return '<button data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(ui.lang===x[0])+'">'+x[1]+'</button>';}).join('');
  return '<div class="top"><div><h1>Force Rating Desk</h1><p class="sub">'+b('Division A · October 2026 cycle','A事业部 · 2026年10月周期')+'</p></div>'+
    '<div class="ctl"><label class="v">'+b('View as','查看身份')+'<select id="viewer">'+opts+'</select></label><div class="seg" role="group" aria-label="Language">'+lg+'</div></div></div>';
}
function strip(){
  var all=Object.keys(T).map(function(k){return T[k];});
  var k0=S.emps.filter(function(e){return e.kpi!=null;}).length,n=S.emps.length;
  var h='<div class="gate"><div class="gl"><b>G0</b>'+b('KPI completed','KPI已完成')+'</div><div class="gv">'+k0+' / '+n+'</div><div class="bar"><i style="width:'+(k0/n*100)+'%"></i></div></div>';
  [1,2,3].forEach(function(s){
    var ts=all.filter(function(t){return t.s===s;}),d=ts.filter(function(t){return S.sub[t.key];}).length;
    h+='<div class="gate"><div class="gl"><b>S'+s+'</b>'+b(STAGES[s].en,STAGES[s].zh)+'</div><div class="gv">'+d+' / '+ts.length+'</div><div class="bar"><i style="width:'+(ts.length?d/ts.length*100:0)+'%"></i></div></div>';
  });
  return '<div class="strip">'+h+'</div>';
}
function tabs(list){
  var names={rating:['Rating','评级'],recap:['Department recap','部门汇总'],progress:['Progress & gates','进度与关卡'],audit:['Audit log','审计记录']};
  return '<div class="tabs" role="tablist">'+list.map(function(k){return '<button role="tab" data-act="tab" data-v="'+k+'" aria-selected="'+(ui.tab===k)+'">'+b(names[k][0],names[k][1])+'</button>';}).join('')+'</div>';
}
function footer(){

/* ---------- actions ---------- */
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){el.className='';},2200);}
function editable(t,e){var i=info(t);return !i.sub&&i.st!=='locked'&&e.kpi!=null;}
function doRate(id,s,g){
  var e=S.emps.filter(function(x){return x.id===id;})[0],t=T[s+':'+V().id];
  if(!e||!t||!editable(t,e)||e.rt[s]===g)return;
  var old=e.rt[s];e.rt[s]=g;
  if(!changed(e,s))delete e.rm[s];
  log('Rated · '+STAGES[s].se,e.name+' ('+e.id+') '+(old||'–')+' → '+g);save();render();
  if(needRemark(e,s)){var el=document.getElementById('rm-'+id);if(el)el.focus();}
}
function suggestFor(t,onlyEmpty){
  var n0=0;
  GROUPS.forEach(function(g){
    var its=t.items.filter(function(x){return x.e.level===g.id&&editable(t,x.e);}).sort(function(a,c){return c.e.kpi-a.e.kpi;});
    var n=its.length;if(!n)return;
    var nS=Math.round(n*.025),nA=Math.round(n*.175),nC=Math.round(n*.075),nD=Math.round(n*.025);
    its.forEach(function(x,i){if(onlyEmpty&&x.e.rt[1])return;x.e.rt[1]=i<nS?'S':i<nS+nA?'A':i>=n-nD?'D':i>=n-nD-nC?'C':'B';n0++;});
  });
  return n0;
}
function doSuggest(){
  var t=T[ui.task];if(!t||t.s!==1)return;
  var n0=suggestFor(t);
  log('Suggested from KPI rank',n0+' ratings filled for '+pname(t.r));save();render();toast(p('Suggestion filled. Review and adjust.','已填入建议，请复核调整。'));
}
function demoStep(){
  T=buildTasks();
  var keys=Object.keys(T).filter(function(k){var i=info(T[k]);return i.st!=='submitted'&&i.st!=='locked';});
  var n=0,skip=0,blk=0;
  keys.forEach(function(k){
    var t=T[k],i=info(t);if(i.kpiPend){skip++;return;}
    if(t.s===1)suggestFor(t,true);
    var bl=blockers(t,info(t));if(bl.unrated||bl.remark){blk++;return;}
    S.sub[k]=true;
    t.items.forEach(function(x){var nx=chain(x.e)[x.i+1];if(nx&&!x.e.rt[nx.s])x.e.rt[nx.s]=x.e.rt[t.s];});
    log('Demo submit · '+STAGES[t.s].se,pname(t.r)+' ('+i.total+')');n++;
  });
  save();render();
  var en=[n+' task(s) submitted'],zh=['已提交'+n+'个任务'];
  if(skip){en.push(skip+' waiting for KPI');zh.push(skip+'个待KPI');}
  if(blk){en.push(blk+' missing remarks');zh.push(blk+'个缺少说明');}
  toast(n||skip||blk?p(en.join(', '),zh.join('，')):p('Nothing to run: all done.','无可执行任务：已全部完成。'));
}
function orgTree(){
  function sc(k){var t=T[k];if(!t)return '';var i=info(t);return statusChip(i.st);}
  var ch1=T['1:CH01'],ch3=T['3:CH01'];
  var h='<div class="pad"><div class="row"><b>'+b('Division A','A事业部')+'</b><span class="mut">· '+esc(pname('CH01'))+'</span><span class="chip">S1 '+b('Dept Heads','部门负责人')+'</span> '+sc('1:CH01')+'<span class="chip">S3 '+b('Final','终评')+'</span> '+sc('3:CH01')+'</div><ul class="org">';
  S.emps.filter(function(e){return e.level==='SD';}).forEach(function(dh){
    h+='<li><div class="row"><b>'+esc(dh.name)+'</b><span class="mut">· '+b(dname(dh.dept).en,dname(dh.dept).zh)+' '+b('Dept Head','部门负责人')+'</span><span class="chip">S1 '+b('Managers','经理')+'</span> '+sc('1:'+dh.id)+'<span class="chip">S2</span> '+sc('2:'+dh.id)+'</div><ul class="org">';
    S.emps.filter(function(e){return e.level==='MA'&&e.dh===dh.id;}).forEach(function(m){
      var t=T['1:'+m.id],i=t?info(t):null;
      h+='<li><div class="row"><span>'+esc(m.name)+'</span><span class="mut mono">'+(i?i.rated+'/'+i.total:'')+'</span><span class="chip">S1</span> '+sc('1:'+m.id)+'</div></li>';
    });
    h+='</ul></li>';
  });
  return h+'</ul></div>';
}
function doSubmit(){
  var t=T[ui.task],inf=info(t),bl=blockers(t,inf);
  if(inf.sub||inf.st==='locked'||bl.kpi||bl.unrated||bl.remark){ui.confirm=null;render();return;}
  S.sub[t.key]=true;
  t.items.forEach(function(x){var nx=chain(x.e)[x.i+1];if(nx&&!x.e.rt[nx.s])x.e.rt[nx.s]=x.e.rt[t.s];});
  log('Submitted · '+STAGES[t.s].se,inf.total+' employees locked');ui.confirm=null;save();render();toast(p('Submitted and locked.','已提交并锁定。'));
}
function doReturn(){
  var t=T[ui.reopen],reason=ui.reopenReason.trim();if(!t||!reason||!canReturn(t))return;
  S.sub[t.key]=false;
  t.items.forEach(function(x){var nx=chain(x.e)[x.i+1];if(nx){delete x.e.rt[nx.s];delete x.e.rm[nx.s];}});
  log('Returned · '+STAGES[t.s].se,pname(t.r)+': '+reason);ui.reopen=null;ui.reopenReason='';save();render();
}
function doSync(id){
  var e=S.emps.filter(function(x){return x.id===id;})[0];if(!e||e.kpi!=null)return;
  e.kpi=Math.round((78+(parseInt(id.slice(1),10)%17))*10)/10;log('KPI synced (demo)',e.name+' → '+e.kpi.toFixed(1));save();render();
}
function copyTSV(){
  var txt=tsvText();
  try{navigator.clipboard.writeText(txt).then(function(){toast(p('Recap copied.','汇总已复制。'));},function(){ui.tsv=txt;render();});}
  catch(err){ui.tsv=txt;render();}
}

$app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;var a=el.dataset.act,d=el.dataset;
  if(a==='lang'){ui.lang=d.v;render();}
  else if(a==='tab'){ui.tab=d.v;ui.confirm=null;render();}
  else if(a==='task'){ui.task=d.v;ui.confirm=null;render();}
  else if(a==='rate')doRate(d.id,+d.s,d.g);
  else if(a==='suggest')doSuggest();
  else if(a==='submit'){ui.confirm=ui.task;render();}
  else if(a==='submit-no'){ui.confirm=null;render();}
  else if(a==='submit-go')doSubmit();
  else if(a==='rstage'){ui.recapStage=+d.v;render();}
  else if(a==='copy')copyTSV();
  else if(a==='tsv-close'){ui.tsv=null;render();}
  else if(a==='reopen'){ui.reopen=d.v;ui.reopenReason='';render();var r=document.getElementById('rreason');if(r)r.focus();}
  else if(a==='reopen-no'){ui.reopen=null;render();}
  else if(a==='reopen-go')doReturn();
  else if(a==='sync')doSync(d.id);
  else if(a==='demo')demoStep();
  else if(a==='reset-ask'){ui.resetAsk=true;render();}
  else if(a==='reset-no'){ui.resetAsk=false;render();}
  else if(a==='reset-go'){S=seed();ui.resetAsk=false;ui.task=null;ui.confirm=null;ui.reopen=null;save();render();toast(p('Sample data restored.','已恢复示例数据。'));}
});
$app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='viewer'){ui.viewer=el.value;ui.tab=V().role==='hr'?'progress':'rating';ui.task=null;ui.confirm=null;ui.reopen=null;render();}
  else if(el.id==='rgrp'){ui.recapGroup=el.value;render();}
  else if(el.id==='drafts'){ui.drafts=el.checked;render();}
  else if(el.dataset&&el.dataset.inp==='remark'){var e=S.emps.filter(function(x){return x.id===el.dataset.id;})[0];if(e)log('Remark · '+STAGES[+el.dataset.s].se,e.name+': '+el.value);save();}
});
$app.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.inp==='remark'){
    var e=S.emps.filter(function(x){return x.id===el.dataset.id;})[0];if(!e)return;
    e.rm[+el.dataset.s]=el.value;el.classList.toggle('req',!el.value.trim());
    var bar=document.getElementById('bar'),t=T[ui.task];if(bar&&t)bar.innerHTML=barHTML(t,info(t));
  }else if(el.id==='rreason'){ui.reopenReason=el.value;var c=document.getElementById('rconf');if(c)c.disabled=!el.value.trim();el.classList.toggle('req',!el.value.trim());}
});

S=load();
if(!person(ui.viewer))ui.viewer='HR';
render();
})();
</script>
</body>
